<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pluto Glass</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 30px;
    }

    button {
      font-size: 28px;
      padding: 20px 35px;
      border-radius: 18px;
      border: 2px solid white;
      background: #6f2cff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>PLUTO GLASS</h1>

  <button onclick="openPluto()">
    ▶ OPEN PLUTO TV
  </button>

  <script>
    function openPluto() {
      window.location.href = "https://pluto.tv/";
    }
  </script>

</body>
</html>
