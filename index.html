<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pluto Compatibility Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h2 {
      margin: 5px 0 15px;
    }

    iframe {
      width: 92%;
      height: 65%;
      border: 2px solid white;
      border-radius: 10px;
      background: black;
    }

    #status {
      margin-top: 12px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h2>PLUTO TEST</h2>

<iframe
  id="plutoFrame"
  src="https://pluto.tv/us/live-tv"
  allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
  referrerpolicy="origin">
</iframe>

<div id="status">Testing Pluto Live TV...</div>

<script>
  const frame = document.getElementById("plutoFrame");

  frame.addEventListener("load", () => {
    document.getElementById("status").innerText =
      "Pluto page loaded";
  });
</script>

</body>
</html>
