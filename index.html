<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meta Live TV</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#player {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

#channelName {
  position: fixed;
  top: 8px;
  left: 10px;
  background: rgba(0,0,0,.7);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 16px;
}

#status {
  position: fixed;
  top: 8px;
  right: 10px;
  background: rgba(0,0,0,.7);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 14px;
}

#controls {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  background: rgba(0,0,0,.75);
  padding: 8px;
  border-radius: 14px;
  transition: opacity .25s;
}

button {
  border: 1px solid white;
  background: #222;
  color: white;
  font-size: 18px;
  padding: 12px 16px;
  border-radius: 10px;
}

.hidden {
  opacity: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<video
  id="player"
  autoplay
  muted
  playsinline>
</video>

<div id="channelName">
  LIVE WEATHER TV
</div>

<div id="status">
  Loading...
</div>

<div id="controls">

  <button onclick="toggleSound()">
    🔊
  </button>

  <button onclick="togglePlay()">
    ⏯
  </button>

  <button onclick="reloadStream()">
    ↻
  </button>

  <button onclick="hideControls()">
    ⛶
  </button>

</div>

<script>

const player =
  document.getElementById("player");

const status =
  document.getElementById("status");

const controls =
  document.getElementById("controls");

const stream =
  "https://alwxnet-ott-proxy.cloud9streaming.com/alwxnet/live/playlist.m3u8";


function startStream() {

  status.innerText =
    "Loading...";

  player.src =
    stream;

  player.load();

  player.play()
    .catch(function() {
      status.innerText =
        "Tap play";
    });

}


function toggleSound() {

  player.muted =
    !player.muted;

}


function togglePlay() {

  if (player.paused) {
    player.play();
  } else {
    player.pause();
  }

}


function reloadStream() {

  startStream();

}


function hideControls() {

  controls.classList.add(
    "hidden"
  );

}


player.addEventListener(
  "playing",
  function() {

    status.innerText =
      "LIVE";

  }
);


player.addEventListener(
  "waiting",
  function() {

    status.innerText =
      "Buffering";

  }
);


player.addEventListener(
  "error",
  function() {

    if (player.error) {

      status.innerText =
        "ERROR " +
        player.error.code;

    } else {

      status.innerText =
        "Stream Error";

    }

  }
);


player.addEventListener(
  "click",
  function() {

    controls.classList.remove(
      "hidden"
    );

    clearTimeout(
      window.hideTimer
    );

    window.hideTimer =
      setTimeout(
        function() {

          controls.classList.add(
            "hidden"
          );

        },
        3000
      );

  }
);


startStream();

</script>

</body>
</html>
