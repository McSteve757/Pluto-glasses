<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pluto Glass Controls Test</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

h1 {
  font-size: 24px;
  margin: 8px 0;
}

video {
  width: 80%;
  height: 180px;
  object-fit: contain;
  background: #111;
}

.controls {
  width: 90%;
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}

button {
  font-size: 18px;
  padding: 14px 18px;
  min-width: 120px;
  border: 2px solid white;
  border-radius: 12px;
  background: #222;
  color: white;
}

button:focus {
  background: white;
  color: black;
}

#status {
  font-size: 16px;
  margin-top: 8px;
}
</style>
</head>

<body>

<h1>PLUTO GLASS TEST</h1>

<video
  id="player"
  autoplay
  muted
  playsinline>
</video>

<div class="controls">
  <button onclick="togglePlay()">PLAY / PAUSE</button>
  <button onclick="toggleSound()">SOUND</button>
</div>

<div id="status">Ready</div>

<script>
const player = document.getElementById("player");
const status = document.getElementById("status");

player.src =
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

function togglePlay() {
  if (player.paused) {
    player.play();
    status.innerText = "PLAYING";
  } else {
    player.pause();
    status.innerText = "PAUSED";
  }
}

function toggleSound() {
  player.muted = !player.muted;
  status.innerText =
    player.muted ? "MUTED" : "SOUND ON";
}
</script>

</body>
</html>
