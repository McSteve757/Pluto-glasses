<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tubi Glass Test</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 26px;
      margin: 10px;
    }

    iframe {
      width: 96%;
      height: 78%;
      border: none;
      background: black;
    }

    #status {
      margin-top: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>TUBI LIVE TV</h1>

  <iframe
    src="https://tubitv.com/live"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>

  <div id="status">Loading Tubi...</div>

</body>
</html>
