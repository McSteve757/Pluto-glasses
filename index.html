<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pluto Glass Player</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

video {
    width: 95%;
    max-height: 62vh;
    background: black;
}

.controls {
    display: flex;
    gap: 14px;
    margin-top: 15px;
}

button {
    font-size: 22px;
    padding: 18px 24px;
    min-width: 135px;
    border-radius: 14px;
    border: 2px solid white;
    background: #222;
    color: white;
}

button:focus {
    outline: 4px solid white;
    background: #555;
}

#status {
    margin-top: 12px;
    font-size: 18px;
}
</style>
</head>

<body>

<h2>PLUTO GLASS</h2>

<video
    id="player"
    autoplay
    muted
    playsinline>
</video>

<div class="controls">

<button id="playButton" onclick="togglePlay()">
    ⏯ PLAY
</button>

<button id="soundButton" onclick="toggleSound()">
    🔇 SOUND
</button>

</div>

<div id="status">
LIVE • Native HLS
</div>

<script>

const player = document.getElementById("player");

const playButton =
document.getElementById("playButton");

const soundButton =
document.getElementById("soundButton");

const status =
document.getElementById("status");

player.src =
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";


function togglePlay() {

    if (player.paused) {

        player.play();

        playButton.innerText =
        "⏸ PAUSE";

        status.innerText =
        "PLAYING";

    } else {

        player.pause();

        playButton.innerText =
        "▶ PLAY";

        status.innerText =
        "PAUSED";

    }
}


function toggleSound() {

    player.muted = !player.muted;

    if (player.muted) {

        soundButton.innerText =
        "🔇 SOUND";

        status.innerText =
        "MUTED";

    } else {

        soundButton.innerText =
        "🔊 MUTE";

        status.innerText =
        "SOUND ON";

    }
}

</script>

</body>
</html>
