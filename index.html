<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meta Live TV</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#player {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

#controls {
  position: fixed;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;

  background: rgba(0,0,0,.65);
  padding: 8px;
  border-radius: 14px;

  transition: opacity .3s;
}

button {
  border: 1px solid white;
  background: rgba(30,30,30,.9);
  color: white;

  font-size: 17px;
  padding: 12px 16px;
  border-radius: 10px;
}

#channel {
  position: fixed;
  top: 8px;
  left: 12px;

  color: white;
  background: rgba(0,0,0,.6);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 17px;
}

.hidden {
  opacity: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<video
  id="player"
  autoplay
  muted
  playsinline>
</video>

<div id="channel">
  DW English • LIVE
</div>

<div id="controls">

  <button onclick="togglePlay()">
    ⏯
  </button>

  <button onclick="toggleSound()">
    🔊
  </button>

  <button onclick="hideControls()">
    ⛶ VIDEO
  </button>

</div>

<script>

const player =
  document.getElementById("player");

const controls =
  document.getElementById("controls");

player.src =
"https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/master.m3u8";


function togglePlay() {

  if (player.paused) {
    player.play();
  }
  else {
    player.pause();
  }

}


function toggleSound() {

  player.muted =
    !player.muted;

}


function hideControls() {

  controls.classList.add("hidden");

}


// tap video to bring controls back

player.addEventListener(
  "click",
  function() {

    controls.classList.remove("hidden");

    clearTimeout(
      window.hideTimer
    );

    window.hideTimer =
      setTimeout(function() {

        controls.classList.add("hidden");

      }, 3000);

  }
);

</script>

</body>
</html>
