<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meta Live TV</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#player {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

#topbar {
  position: fixed;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.badge {
  background: rgba(0,0,0,.7);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 15px;
}

#controls {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  background: rgba(0,0,0,.75);
  padding: 8px;
  border-radius: 14px;
}

button {
  border: 1px solid white;
  background: #222;
  color: white;
  padding: 12px 15px;
  border-radius: 10px;
  font-size: 17px;
}

.hidden {
  opacity: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<video
  id="player"
  autoplay
  muted
  playsinline>
</video>

<div id="topbar">
  <div id="channel" class="badge">HLS TEST</div>
  <div id="status" class="badge">Loading...</div>
</div>

<div id="controls">

  <button onclick="toggleSound()">
    🔊
  </button>

  <button onclick="togglePlay()">
    ⏯
  </button>

  <button onclick="reloadStream()">
    ↻
  </button>

  <button onclick="hideControls()">
    ⛶
  </button>

</div>

<script>

const player =
  document.getElementById("player");

const status =
  document.getElementById("status");

const controls =
  document.getElementById("controls");

const channel =
  document.getElementById("channel");

/*
KNOWN WORKING BASELINE
You already confirmed this works
on your Meta Display.
*/

let stream =
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";


function loadStream(url, name) {

  channel.innerText =
    name || "LIVE TV";

  status.innerText =
    "Loading...";

  player.src =
    url;

  player.load();

  player.play()
    .catch(function(error) {

      status.innerText =
        "Tap PLAY";

    });

}


function toggleSound() {

  player.muted =
    !player.muted;

}


function togglePlay() {

  if (player.paused) {

    player.play();

  } else {

    player.pause();

  }

}


function reloadStream() {

  loadStream(
    stream,
    channel.innerText
  );

}


function hideControls() {

  controls.classList.add("hidden");

}


player.addEventListener(
  "playing",
  function() {

    status.innerText =
      "LIVE";

  }
);


player.addEventListener(
  "waiting",
  function() {

    status.innerText =
      "Buffering";

  }
);


player.addEventListener(
  "error",
  function() {

    const err =
      player.error;

    if (err) {

      status.innerText =
        "ERROR " + err.code;

    } else {

      status.innerText =
        "STREAM ERROR";

    }

  }
);


player.addEventListener(
  "click",
  function() {

    controls.classList.remove(
      "hidden"
    );

    clearTimeout(
      window.hideTimer
    );

    window.hideTimer =
      setTimeout(
        function() {

          controls.classList.add(
            "hidden"
          );

        },
        3000
      );

  }
);


loadStream(
  stream,
  "HLS TEST"
);

</script>

</body>
</html>
