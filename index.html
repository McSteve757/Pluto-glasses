<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meta Live TV</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#player {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

#channelName {
  position: fixed;
  top: 8px;
  left: 10px;
  background: rgba(0,0,0,.72);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 16px;
}

#status {
  position: fixed;
  top: 8px;
  right: 10px;
  background: rgba(0,0,0,.72);
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 14px;
}

#controls {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  background: rgba(0,0,0,.75);
  padding: 8px;
  border-radius: 14px;
  transition: opacity .25s;
}

button {
  border: 1px solid white;
  background: #222;
  color: white;
  font-size: 18px;
  padding: 12px 16px;
  border-radius: 10px;
}

.hidden {
  opacity: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<video
  id="player"
  autoplay
  muted
  playsinline>
</video>

<div id="channelName">
  PLAYER TEST
</div>

<div id="status">
  Starting...
</div>

<div id="controls">
  <button onclick="toggleSound()">🔊</button>
  <button onclick="togglePlay()">⏯</button>
  <button onclick="reloadStream()">↻</button>
  <button onclick="hideControls()">⛶</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<script>

const player = document.getElementById("player");
const status = document.getElementById("status");
const controls = document.getElementById("controls");

/*
THIS IS THE STREAM YOU ALREADY CONFIRMED
WORKS ON YOUR META DISPLAY.
*/
const stream =
"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

let hls = null;

function startStream() {

  status.innerText = "Loading...";

  if (hls) {
    hls.destroy();
    hls = null;
  }

  /*
  FIRST: use native HLS if available.
  Your glasses already proved this works.
  */
  if (
    player.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    status.innerText =
      "Native HLS";

    player.src = stream;

    player.load();

    player.play()
      .catch(function() {
        status.innerText =
          "Tap Play";
      });

  }

  /*
  SECOND: fallback to hls.js
  if native HLS is unavailable.
  */
  else if (Hls.isSupported()) {

    status.innerText =
      "HLS.js";

    hls = new Hls();

    hls.loadSource(stream);

    hls.attachMedia(player);

    hls.on(
      Hls.Events.MANIFEST_PARSED,
      function() {

        status.innerText =
          "HLS.js Ready";

        player.play()
          .catch(function() {
            status.innerText =
              "Tap Play";
          });

      }
    );

    hls.on(
      Hls.Events.ERROR,
      function(event, data) {

        status.innerText =
          "HLS ERROR";

        console.log(data);

      }
    );

  }

  else {

    status.innerText =
      "HLS Unsupported";

  }

}


function toggleSound() {

  player.muted =
    !player.muted;

}


function togglePlay() {

  if (player.paused) {

    player.play();

  } else {

    player.pause();

  }

}


function reloadStream() {

  startStream();

}


function hideControls() {

  controls.classList.add(
    "hidden"
  );

}


player.addEventListener(
  "playing",
  function() {

    status.innerText =
      "PLAYING";

  }
);


player.addEventListener(
  "waiting",
  function() {

    status.innerText =
      "BUFFERING";

  }
);


player.addEventListener(
  "click",
  function() {

    controls.classList.remove(
      "hidden"
    );

    clearTimeout(
      window.hideTimer
    );

    window.hideTimer =
      setTimeout(
        function() {

          controls.classList.add(
            "hidden"
          );

        },
        3000
      );

  }
);


startStream();

</script>

</body>
</html>
